name: CI

# Forgejo prefers this directory to .github/workflows. The public GitHub lane
# continues to use its hosted runner; this lane uses an existing checkout key.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: CI
    runs-on: ci-deploy-key
    timeout-minutes: 10
    steps:
      - name: Test the triggering commit in a disposable environment
        env:
          TARGET_SHA: ${{ github.sha }}
          # The SSH host comes from a repository variable, never from the server
          # URL: a runner registered at the ingress name gets that name as
          # server_url, and the ingress sshd is not the forge (aegis-ri41fq).
          SSH_HOST: ${{ vars.FORGE_SSH_HOST }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          KEY="$HOME/.ssh/ci_readonly_deploy"
          test -f "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o BatchMode=yes -o StrictHostKeyChecking=yes"
          if [ -z "${SSH_HOST:-}" ]; then
            echo "::error::repository variable FORGE_SSH_HOST is unset; refusing to guess the forge's SSH host"
            exit 1
          fi
          HOST="$SSH_HOST"
          WORKDIR=$(mktemp -d)
          trap 'rm -rf "$WORKDIR"' EXIT
          git clone --depth 1 "ssh://git@$HOST/$REPOSITORY.git" "$WORKDIR"
          cd "$WORKDIR"
          git fetch --depth 1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python3 -m venv .test-tools
          .test-tools/bin/python -m pip install --disable-pip-version-check pytest
          .test-tools/bin/python -m pytest skills test_readme_inventory.py scripts/test_build_bundle.py scripts/test_forgejo_release.py -q --junitxml="$WORKDIR/results.xml"
          .test-tools/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('results.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          count = sum(int(suite.get('tests', 0)) for suite in suites)
          print(f'tests executed: {count}')
          if count < 40:
              raise SystemExit(f'only {count} tests ran; required floor is 40')
          PY

  release:
    name: Forgejo release PR and bundle
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ci-deploy-key
    timeout-minutes: 10
    steps:
      - name: Propose a release or publish an independently reviewed merged release PR
        env:
          FORGEJO_EVENT_NAME: ${{ github.event_name }}
          FORGEJO_REF: ${{ github.ref }}
          FORGEJO_SHA: ${{ github.sha }}
          FORGEJO_SERVER_URL: ${{ github.server_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ github.token }}
          SSH_HOST: ${{ vars.FORGE_SSH_HOST }}
        run: |
          set -euo pipefail
          test -n "${SSH_HOST:-}"
          KEY="$HOME/.ssh/ci_readonly_deploy"
          test -f "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o BatchMode=yes -o StrictHostKeyChecking=yes"
          RELEASE_WORKDIR=$(mktemp -d)
          trap 'rm -rf "$RELEASE_WORKDIR"' EXIT
          git clone "ssh://git@$SSH_HOST/$FORGEJO_REPOSITORY.git" "$RELEASE_WORKDIR/repo"
          cd "$RELEASE_WORKDIR/repo"
          git checkout --detach "$FORGEJO_SHA"
          test "$(git rev-parse HEAD)" = "$FORGEJO_SHA"
          python3 scripts/forgejo_release.py --execute --output "$RELEASE_WORKDIR/assets"
